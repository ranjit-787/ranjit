
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            text-align: center;
            padding: 80px 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #5b4bdb;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            background: #5b4bdb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3728a8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>This is my first HTML webpage. 
           I am learning how to build websites.</p>

        <button onclick="showMessage()">
            Click Me!
        </button>
    </div>

    <script>
        function showMessage() {
            alert("Hello! Welcome to my website!");
        }
    </script>
</body>
</html>
